name: System Health Check

on:
  schedule:
    # Daily at 13:00 UTC (09:00 ET) — runs just before the US session opens
    - cron: '17 13 * * *'
  workflow_dispatch:

# Deliberately NOT in the alpaca-trader concurrency group: the watchdog must run
# even when trading runs are stuck, queued, or failing.
concurrency:
  group: health-check
  cancel-in-progress: false

permissions:
  contents: read
  issues: write        # to file/close the health-check issue

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run health check
        run: python3 bot/healthcheck.py
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TZ: America/New_York
