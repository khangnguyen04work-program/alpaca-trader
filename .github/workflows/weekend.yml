name: Weekend Analysis

on:
  schedule:
    # Sat & Sun — every 30 min, 6AM-6PM ET
    - cron: '*/30 10-22 * * 6,0'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Weekend market analysis
        run: python3 bot/trader.py
        env:
          APCA_ACCESS_TOKEN: ${{ secrets.APCA_ACCESS_TOKEN }}
          ALPACA_BOT_DIR: ${{ github.workspace }}
          TZ: America/New_York