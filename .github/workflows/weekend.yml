name: Weekend Analysis

on:
  schedule:
    # Sat & Sun — every 15 min, 6AM-6PM ET
    - cron: '*/15 10-22 * * 6,0'
  workflow_dispatch:

# Prevent overlapping weekend runs from stacking up
concurrency:
  group: alpaca-trader
  cancel-in-progress: false   # queue, never cancel — cancellation mid-cycle can orphan positions

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Weekend market analysis
        run: python3 bot/trader.py
        env:
          APCA_ACCESS_TOKEN: ${{ secrets.APCA_ACCESS_TOKEN }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          ALPACA_BOT_DIR: ${{ github.workspace }}
          TZ: America/New_York