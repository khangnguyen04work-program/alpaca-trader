name: Alpaca Paper Trader

on:
  schedule:
    # Market hours — every 5 min for best entry timing (9:30AM-4PM ET = 13:30-20:00 UTC)
    - cron: '*/5 13-19 * * 1-5'
    # Pre-market analysis — every 15 min (4AM-9:30AM ET = 08:00-13:25 UTC)
    - cron: '*/15 8-12 * * 1-5'
    # After-hours analysis — every 15 min (4PM-8PM ET = 20:00-00:00 UTC)
    - cron: '*/15 0,20-23 * * 1-5'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run trader
        run: python3 bot/trader.py
        env:
          APCA_ACCESS_TOKEN: ${{ secrets.APCA_ACCESS_TOKEN }}
          ALPACA_BOT_DIR: ${{ github.workspace }}
          TZ: America/New_York