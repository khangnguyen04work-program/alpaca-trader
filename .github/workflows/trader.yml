name: Alpaca Paper Trader

on:
  schedule:
    # ─── Market hours: every 2 min, Mon–Fri 9:30AM–4PM ET (13:30–20:00 UTC) ───
    - cron: '*/2 13-19 * * 1-5'
    # ─── Pre-market: every 15 min, 8:00–9:30AM ET (12:00–13:29 UTC) ───
    - cron: '*/15 12-13 * * 1-5'
    # ─── After-hours: every 15 min, 4:00–8:00PM ET (20:00–23:59 UTC) ───
    - cron: '*/15 20-23 * * 1-5'
  workflow_dispatch:

# Never allow overlapping runs — a slow run (rate-limited API) would otherwise
# run in parallel with the next cron trigger and place duplicate orders.
concurrency:
  group: alpaca-trader
  cancel-in-progress: false   # queue, never cancel — cancellation mid-cycle can orphan positions

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run trader
        run: python3 bot/trader.py
        env:
          APCA_ACCESS_TOKEN: ${{ secrets.APCA_ACCESS_TOKEN }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          ALPACA_BOT_DIR: ${{ github.workspace }}
          TZ: America/New_York