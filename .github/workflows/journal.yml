name: Alpaca Daily Journal

on:
  schedule:
    # Mon-Fri at 4:30 PM ET (20:30 UTC)
    - cron: '47 20 * * 1-5'
  workflow_dispatch:

# Allow the built-in GITHUB_TOKEN to push the journal back to the repo
permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run journal
        run: python3 bot/trader.py --journal
        env:
          APCA_ACCESS_TOKEN: ${{ secrets.APCA_ACCESS_TOKEN }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          ALPACA_BOT_DIR: ${{ github.workspace }}
          TZ: America/New_York
      # Persist journals PERMANENTLY in git history (artifacts expire after 90 days)
      - name: Commit journal to repo
        run: |
          git config user.name "alpaca-bot"
          git config user.email "bot@users.noreply.github.com"
          git add runs/journal-*.md runs/signals-*.json
          if git diff --cached --quiet; then
            echo "No new journal changes"
          else
            git commit -m "journal: $(TZ=America/New_York date +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push origin main
          fi
      - name: Upload journal artifact (90-day convenience copy)
        uses: actions/upload-artifact@v4
        with:
          name: journal-${{ github.run_number }}
          path: runs/journal-*.md