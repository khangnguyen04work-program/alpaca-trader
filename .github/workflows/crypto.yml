name: Alpaca Crypto Trader (24/7)
# (schedule registration refreshed 2026-10-17 06:05 UTC)

on:
  schedule:
    # Crypto never closes — every 30 min, every day, all year
    - cron: '7,37 * * * *'
  workflow_dispatch:

# Runs fire 24/7 so stop-losses stay monitored around the clock, but NEW entries
# are gated inside trader.py to all non-market hours — crypto trades exactly while
# the equity market is closed (Alpaca clock: nights, weekends, holidays, early closes).
# Crypto and equity runs share one Alpaca account — serialize all trading
concurrency:
  group: alpaca-trader
  cancel-in-progress: false   # queue, never cancel — cancellation mid-cycle can orphan positions

permissions:
  contents: write      # persist run artifacts (signals) back to the repo

jobs:
  crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run crypto trader
        run: python3 bot/trader.py --crypto
        env:
          APCA_ACCESS_TOKEN: ${{ secrets.APCA_ACCESS_TOKEN }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          ALPACA_BOT_DIR: ${{ github.workspace }}
          TZ: America/New_York

      # GitHub runners are ephemeral — persist run artifacts or the journal
      # cannot attribute patterns/exit reasons to trades (and the funnel loses data)
      - name: Persist run artifacts
        if: always()
        run: |
          git config user.name "alpaca-bot"
          git config user.email "bot@users.noreply.github.com"
          git add runs/
          if git diff --cached --quiet; then
            echo "No new artifacts"
          else
            git commit -m "runs: $(TZ=America/New_York date +'%Y-%m-%d %H:%M') signals"
            git pull --rebase origin main || true
            git push origin main || { sleep 5; git pull --rebase origin main; git push origin main; }
          fi
